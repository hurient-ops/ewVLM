<style>
        body { background-color: #070A13; color: #E2E8F0; }
        .input-industrial {
            background-color: #121724;
            border: 1px solid #232C3F;
            color: #E2E8F0;
            transition: all 0.2s ease;
        }
        .input-industrial:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 1px #7c3aed;
        }
        .btn-primary {
            background-color: #7c3aed;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #5a00c6;
        }
        .radio-industrial:checked {
            background-color: #7c3aed;
            border-color: #7c3aed;
        }
    </style>

<body class="min-h-screen flex flex-col items-center justify-center p-4 antialiased">
<!-- Top Navigation Placeholder (Hidden for transactional flow) -->
<nav aria-hidden="true" class="hidden"></nav>
<div class="w-full max-w-2xl bg-surface rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.5)] border border-border-subtle overflow-hidden">
<!-- Header -->
<div class="bg-surface-container border-b border-border-subtle p-6 flex flex-col items-center">
<div class="flex items-center gap-3 mb-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">security</span>
<h1 class="font-display-lg text-display-lg text-primary font-bold">ewVLM-Core</h1>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">지능형 영상 관제 플랫폼 회원가입</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 text-center">보안 접근을 위한 관리자 계정 생성 절차입니다.</p>
</div>
<!-- Form Content -->
<div class="p-8">
<form action="#" class="space-y-8" method="POST">
<!-- Section 1: 기본 정보 -->
<div>
<h3 class="font-title-sm text-title-sm text-primary mb-4 border-b border-border-subtle pb-2 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">person</span> 기본 정보
                    </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="name">성명</label>
<input class="input-industrial w-full rounded px-3 py-2 font-body-base text-body-base" id="name" name="name" required="" type="text"/>
</div>
<div class="space-y-1">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="email">이메일 주소</label>
<input class="input-industrial w-full rounded px-3 py-2 font-body-base text-body-base" id="email" name="email" required="" type="email"/>
</div>
<div class="space-y-1">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="password">비밀번호</label>
<input class="input-industrial w-full rounded px-3 py-2 font-body-base text-body-base" id="password" name="password" required="" type="password"/>
</div>
<div class="space-y-1">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="password_confirm">비밀번호 확인</label>
<input class="input-industrial w-full rounded px-3 py-2 font-body-base text-body-base" id="password_confirm" name="password_confirm" required="" type="password"/>
</div>
</div>
</div>
<!-- Section 2: 소속 정보 -->
<div>
<h3 class="font-title-sm text-title-sm text-primary mb-4 border-b border-border-subtle pb-2 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">domain</span> 소속 정보
                    </h3>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<div class="space-y-1 md:col-span-1">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="organization">소속 기관명</label>
<input class="input-industrial w-full rounded px-3 py-2 font-body-base text-body-base" id="organization" name="organization" required="" type="text"/>
</div>
<div class="space-y-1 md:col-span-1">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="department">부서명</label>
<input class="input-industrial w-full rounded px-3 py-2 font-body-base text-body-base" id="department" name="department" required="" type="text"/>
</div>
<div class="space-y-1 md:col-span-1">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="position">직책</label>
<input class="input-industrial w-full rounded px-3 py-2 font-body-base text-body-base" id="position" name="position" required="" type="text"/>
</div>
</div>
</div>
<!-- Section 3: 권한 신청 -->
<div>
<h3 class="font-title-sm text-title-sm text-primary mb-4 border-b border-border-subtle pb-2 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">admin_panel_settings</span> 권한 신청
                    </h3>
<div class="grid grid-cols-1 md:grid-cols-3 gap-3">
<label class="flex items-center gap-3 p-3 rounded border border-border-subtle bg-surface-container-highest cursor-pointer hover:border-outline-variant transition-colors">
<input checked="" class="radio-industrial form-radio h-4 w-4 bg-transparent border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 focus:ring-offset-transparent" name="role" type="radio" value="operator"/>
<span class="font-body-sm text-body-sm text-on-surface">관제 요원</span>
</label>
<label class="flex items-center gap-3 p-3 rounded border border-border-subtle bg-surface-container-highest cursor-pointer hover:border-outline-variant transition-colors">
<input class="radio-industrial form-radio h-4 w-4 bg-transparent border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 focus:ring-offset-transparent" name="role" type="radio" value="supervisor"/>
<span class="font-body-sm text-body-sm text-on-surface">관리 감독자</span>
</label>
<label class="flex items-center gap-3 p-3 rounded border border-border-subtle bg-surface-container-highest cursor-pointer hover:border-outline-variant transition-colors">
<input class="radio-industrial form-radio h-4 w-4 bg-transparent border-outline-variant text-primary focus:ring-primary focus:ring-offset-0 focus:ring-offset-transparent" name="role" type="radio" value="admin"/>
<span class="font-body-sm text-body-sm text-on-surface">시스템 관리자</span>
</label>
</div>
</div>
<!-- Actions -->
<div class="pt-6 border-t border-border-subtle flex flex-col sm:flex-row items-center justify-between gap-4">
<a class="font-body-sm text-body-sm text-primary hover:text-surface-tint transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span> 로그인 화면으로 돌아가기
                    </a>
<button class="btn-primary w-full sm:w-auto px-8 py-3 rounded font-title-sm text-title-sm font-bold flex items-center justify-center gap-2" type="submit">
                        회원가입 완료 <span class="material-symbols-outlined text-[18px]">check_circle</span>
</button>
</div>
</form>
</div>
</div>
</body></html>
